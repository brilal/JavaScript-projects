
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pizza Order</title>
    <link rel="stylesheet" href="Pizza_CSS/Pizza.css">
</head>
<body>
    <h1>Build Your Pizza</h1>

    <div id="pizza-form">
        <label for="size">Choose a size:</label>
        <select id="size">
            <option value="Small">Small</option>
            <option value="Medium">Medium</option>
            <option value="Large">Large</option>
        </select>

        <h2>Toppings</h2>
        <label><input type="checkbox" value="Pepperoni"> Pepperoni</label><br>
        <label><input type="checkbox" value="Mushrooms"> Mushrooms</label><br>
        <label><input type="checkbox" value="Onions"> Onions</label><br>
        <label><input type="checkbox" value="Extra cheese"> Extra cheese</label><br>

        <button id="orderButton">Place Order</button>
    </div>

    <div id="output"></div>

    <script src="Pizza_JavaScript/Pizza.js"></script>
</body>
</html>
