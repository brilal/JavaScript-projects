<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My One-Page Website</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Welcome to My One-Page Website</h1>
  </header>

  <section id="about">
    <h2>About</h2>
    <p>This is my one-page website project.</p>
  </section>

  <section id="gallery">
    <h2>Gallery</h2>
    <div class="gallery">
      <img src="images/photo1.jpg" class="lightbox-image" alt="Photo 1">
      <img src="images/photo2.jpg" class="lightbox-image" alt="Photo 2">
      <img src="images/photo3.jpg" class="lightbox-image" alt="Photo 3">
    </div>
  </section>

  <!-- Lightbox Modal -->
  <div id="lightbox-modal" class="lightbox-modal">
    <span class="lightbox-close">&times;</span>
    <img id="lightbox-img" class="lightbox-content">
  </div>

  <script src="js/script.js"></script>
</body>
</html>
