<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Page Website</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#gallery">Gallery</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <header id="home">
        <h1>Welcome to My One‑Page Website</h1>
        <p>This is a simple one‑page site with a gallery and lightbox feature.</p>
    </header>

    <!-- Gallery Section -->
    <section id="gallery">
        <h2>Image Gallery</h2>
        <div class="gallery">
            <img src="images/photo1.jpg" alt="Photo 1" class="lightbox-image">
            <img src="images/photo2.jpg" alt="Photo 2" class="lightbox-image">
            <img src="images/photo3.jpg" alt="Photo 3" class="lightbox-image">
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact">
        <h2>Contact</h2>
        <p>You can add your contact details or a short message here.</p>
    </section>

    <!-- Lightbox Modal -->
    <div id="lightbox-modal" class="lightbox-modal">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightbox-img" alt="Expanded view">
    </div>

    <!-- JavaScript -->
    <script src="js/script.js"></script>
</body>
</html>
